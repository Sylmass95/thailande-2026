name: Compiler l'APK

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 */3 * *"   # tous les 3 jours : relit la clé de signature pour que GitHub ne l’efface pas (7 jours sans usage)

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  keystore-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/thai-signing/debug.keystore
          key: android-debug-keystore-v2

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : numéro de version 1.<nombre de commits>

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire l'app
        run: |
          npm ci
          npm run build
          mkdir -p apk/www/icons
          cp dist/apk.html apk/www/index.html
          cp dist/icons/* apk/www/icons/

      - name: Générer le projet Android
        working-directory: apk
        run: |
          npm install
          npx cap add android
          pip install pillow
          python3 scripts/prepare-android.py
          npx cap sync android

      - name: Accepter les licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Même clé de signature à chaque compilation : le nouvel APK s’installe par-dessus l’ancien,
      # sans conflit ni perte des données. Sans cela, chaque machine GitHub génère sa propre clé.
      - name: Clé de signature conservée entre les compilations
        uses: actions/cache@v4
        with:
          path: ~/thai-signing/debug.keystore
          key: android-debug-keystore-v2

      - name: Créer la clé de signature si elle n’existe pas encore
        run: |
          mkdir -p ~/thai-signing
          if [ ! -f ~/thai-signing/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/thai-signing/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Nouvelle clé créée (elle sera réutilisée par les prochaines compilations)."
          else
            echo "Clé existante réutilisée."
          fi

      - name: Compiler
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$HOME/thai-signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk ../../thailande-2026.apk

      - name: Empreinte de la signature (doit rester identique d’une compilation à l’autre)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs thailande-2026.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: thailande-2026-apk
          path: thailande-2026.apk

      - name: Publier la dernière version (lien fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK – dernière version
          prerelease: true
          make_latest: false
          files: thailande-2026.apk
