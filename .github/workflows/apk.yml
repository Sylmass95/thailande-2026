name: Compiler l'APK

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 */3 * *"   # tous les 3 jours : relit la clé de signature pour que GitHub ne l’efface pas (7 jours sans usage)

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  keystore-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire l'app
        run: |
          npm ci
          npm run build
          mkdir -p apk/www/icons
          cp dist/apk.html apk/www/index.html
          cp dist/icons/* apk/www/icons/

      - name: Générer le projet Android
        working-directory: apk
        run: |
          npm install
          npx cap add android
          pip install pillow
          python3 scripts/prepare-android.py
          npx cap sync android

      - name: Accepter les licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Même clé de signature à chaque compilation : le nouvel APK s’installe par-dessus l’ancien,
      # sans conflit ni perte des données. Sans cela, chaque machine GitHub génère sa propre clé.
      - name: Clé de signature conservée entre les compilations
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compiler
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../thailande-2026.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thailande-2026-apk
          path: thailande-2026.apk

      - name: Publier la dernière version (lien fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK – dernière version
          prerelease: true
          make_latest: false
          files: thailande-2026.apk
