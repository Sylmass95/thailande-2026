name: Fusion automatique

# Toute branche poussée (par Claude Code ou autre) est testée, transformée en pull request
# puis fusionnée dans main si le build et le test passent. Le Minix récupère main en ~10 s.
# Pour garder une branche en brouillon sans fusion automatique : nommez-la « wip/… ».
on:
  push:
    branches-ignore: [main, "wip/**"]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ouvrir la pull request si besoin
        run: |
          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            TITLE=$(git log -1 --pretty=%s)
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Pull request ouverte automatiquement. Elle sera fusionnée si le build et le test passent."
          fi

      - name: Build et test
        id: test
        continue-on-error: true
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: "Tests en échec, PR laissée ouverte"
        if: steps.test.outcome != 'success'
        run: |
          gh pr comment "$BRANCH" --body "Le build ou le test a échoué : la fusion automatique est suspendue. Demandez à Claude Code de corriger, puis de repousser sur cette branche."
          exit 1

      - name: Fichiers modifiés
        id: diff
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -qE '^(src|public|apk)/'; then echo "apk=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Fusionner dans main
        run: gh pr merge "$BRANCH" --merge --delete-branch

      - name: Recompiler l'APK si l'app a changé
        if: steps.diff.outputs.apk == 'yes'
        run: gh workflow run apk.yml --ref main
